<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.datatables.net/2.3.4/css/dataTables.bootstrap5.css">
	<link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.3.4/css/responsive.bootstrap5.min.css">
	<link rel="stylesheet" href="style.css">
	<title>Rapatin </title>
</head>
<body>
	
	<!-- SIDEBAR -->
	<section id="sidebar">
		<a href="agenda.html" class="logo ps-3"><i class='ps-5'></i> Rapatin</a>
		<ul class="side-menu">
			<li><a href="agenda.html"><i class="fa-solid fa-calendar-days icon"></i> Agenda Rapat</a></li>
			<li><a href="riwayat.html"><i class="fa-solid fa-clock-rotate-left icon"></i> Riwayat Rapat</a></li>
			<li><a href="manage_unit.html" class="active"><i class="fa-solid fa-users icon"></i> Pengaturan Unit</a></li>
			<li><a href="manage_user.html"><i class="fa-solid fa-user icon"></i> Pengaturan Pengguna</a></li>
			<li><a href="pengaturan.html"><i class="fa-solid fa-gear icon"></i> Pengaturan</a></li>
			<li><a href="../login/login.html"><i class="fa-solid fa-right-from-bracket icon"></i> Logout</a></li>
		</ul>
	</section>
	<!-- SIDEBAR -->

	<!-- Content -->
	<section id="content">
		<!-- Toggle Sidebar -->
		<nav>
			<i class='fa-solid fa-bars toggle-sidebar' ></i>
		</nav>
		<!-- End Toggle Sidebar -->

		<!-- Main -->
		<main>
			<div class="rapat bg-light">
				<div class="tableheader">
					<h2>Pengaturan Unit</h2>
					<button type="button" class="btn btn-primary tambah" data-bs-toggle="modal" data-bs-target="#exampleModal">Tambah Unit</button>
				</div>
				<table id="example" class="table table-striped">
        			<thead>
        			    <tr>
        			        <th>No</th>
        			        <th>Nama Unit</th>
        			        <th>Aksi</th>
        			    </tr>
        			</thead>
        			<tbody>
        			    <tr>
        			        <td>1</td>
        			        <td>HMTI</td>
        			        <td>
								<button type="button" class="btn btn-primary aksi" data-bs-toggle="modal" data-bs-target="#editModal"><i class="fa-solid fa-pen-to-square"></i></button>
								<button type="button" class="btn btn-danger aksi" data-bs-toggle="modal" data-bs-target="#deletemodal"><i class="fa-solid fa-trash"></i></i></button>
							</td>
        			    </tr>
                        <tr>
        			        <td>2</td>
        			        <td>REKAM</td>
        			        <td>
								<button type="button" class="btn btn-primary aksi" data-bs-toggle="modal" data-bs-target="#editModal"><i class="fa-solid fa-pen-to-square"></i></button>
								<button type="button" class="btn btn-danger aksi" data-bs-toggle="modal" data-bs-target="#deletemodal"><i class="fa-solid fa-trash"></i></i></button>
							</td>
        			    </tr>
                        <tr>
        			        <td>3</td>
        			        <td>BLUG</td>
        			        <td>
								<button type="button" class="btn btn-primary aksi" data-bs-toggle="modal" data-bs-target="#editModal"><i class="fa-solid fa-pen-to-square"></i></button>
								<button type="button" class="btn btn-danger aksi" data-bs-toggle="modal" data-bs-target="#deletemodal"><i class="fa-solid fa-trash"></i></i></button>
							</td>
        			    </tr>
                        <tr>
        			        <td>4</td>
        			        <td>BEM</td>
        			        <td>
								<button type="button" class="btn btn-primary aksi" data-bs-toggle="modal" data-bs-target="#editModal"><i class="fa-solid fa-pen-to-square"></i></button>
								<button type="button" class="btn btn-danger aksi" data-bs-toggle="modal" data-bs-target="#deletemodal"><i class="fa-solid fa-trash"></i></i></button>
							</td>
        			    </tr>
        			</tbody>
    			</table>
			
			<!-- Modal Tambah Unit -->
			<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
				<div class="modal-dialog">
					<div class="modal-content">
						<div class="modal-header">
							<h5 class="modal-title" id="exampleModalLabel">Tambah Unit</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
						</div>
						<div class="modal-body">
							<form action="#">
								<div class="mb-3">
									<label class="mb-2" for="name">Nama Unit</label>
									<input class="form-control" type="name" name="name" id="name" placeholder="Masukkan Nama Unit...">
								</div>
							</form>
						</div>
						<div class="modal-footer">
							<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
							<button type="button" class="btn btn-primary">Tambah Unit</button>
						</div>
				    </div>
				</div>
			</div>

			<!-- Modal Edit Unit -->
			<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
				<div class="modal-dialog">
					<div class="modal-content">
						<div class="modal-header">
							<h5 class="modal-title" id="exampleModalLabel">Edit Unit</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
						</div>
						<div class="modal-body">
							<form action="#">
								<div class="mb-3">
									<label class="mb-2" for="name">Nama Unit</label>
									<input class="form-control" type="name" name="name" id="name" placeholder="Masukkan Nama Unit...">
								</div>
							</form>
						</div>
						<div class="modal-footer">
							<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
							<button type="button" class="btn btn-primary">Simpan Perubahan</button>
						</div>
				    </div>
				</div>
			</div>
			<!-- End Modal Edit Unit -->

			<!-- Modal Delete Unit -->
			<div class="modal fade" id="deletemodal" tabindex="-1" aria-labelledby="deletemodalLabel" aria-hidden="true">
				<div class="modal-dialog">
					<div class="modal-content">
						<div class="modal-header">
							<h5 class="modal-title" id="exampleModalLabel">Hapus Unit</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
						</div>
						<div class="modal-body">
							<p class="h5">Apakah anda yakin ingin menghapus unit ini?</p>
						</div>
						<div class="modal-footer">
							<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
							<button type="button" class="btn btn-danger">Hapus</button>
						</div>
				    </div>
				</div>
			</div>
			<!-- End Modal Delete Unit -->
			</div>
		</main>
		<!-- End Main -->
	</section>
	<!-- End Content -->

<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<script src="https://cdn.datatables.net/2.3.4/js/dataTables.js"></script>
<script src="https://cdn.datatables.net/2.3.4/js/dataTables.bootstrap5.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
