            ><i class="fa-solid fa-right-from-bracket icon"></i> Keluar</a

    <!-- SIDEBAR -->

    <!-- Content -->
    <section id="content">
      <!-- Toggle Sidebar -->
      <nav class="atas">
        <i data-aos="fade-right" class="fa-solid fa-bars toggle-sidebar"></i>
      </nav>
      <!-- End Toggle Sidebar -->

      <!-- Main -->
      <main>
        <div data-aos="fade-down" class="pengaturan bg-light mx-auto">
          <div class="tableheader">
            <h2>Ganti Kata Sandi</h2>
          </div>
          <form action="">
            <div class="mb-3">
              <label class="mb-2" for="Kata Sandi">Kata Sandi Lama</label>
              <input
                class="form-control"
                type="Kata Sandi"
                name="name"
                id="name"
                placeholder="Masukkan Kata Sandi Lama Anda..."
              />
            </div>
            <div class="mb-3">
              <label class="mb-2" for="Kata Sandi">Kata Sandi Baru</label>
              <input
                class="form-control"
                type="Kata Sandi"
                name="name"
                id="name"
                placeholder="Masukkan Kata Sandi Baru Anda..."
              />
            </div>
            <div class="mb-3">
              <label class="mb-2" for="Kata Sandi">Konfirmasi Kata Sandi</label>
              <input
                class="form-control"
                type="Kata Sandi"
                name="name"
                id="name"
                placeholder="Masukkan Kata Sandi..."
              />
            </div>
            <button
              type="button"
              class="btn btn-primary d-block ms-auto px-3"
              onclick="edit()"
            >
              Simpan
            </button>
          </form>
        </div>
      </main>
      <!-- End Main -->
    </section>
    <!-- End Content -->

    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdn.datatables.net/2.3.4/js/dataTables.js"></script>

    <script src="../assets/admin.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
      AOS.init();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="text/javascript">
      function edit() {
        Swal.fire({
          title: "Selamat!",
          text: "Kata Sandi Berhasil dirubah!",
          icon: "success",
        });
      }
    </script>
